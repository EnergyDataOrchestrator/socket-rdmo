# ---------------------------------------------------------------------------
# dmp
# ---------------------------------------------------------------------------
dmp:

  title:
    template: "maDMP for {project.title}"
    # alternative: bind the DMP title to an RDMO answer instead
    # attribute: project/research_question/title

  created:
    project_field: created
  modified:
    project_field: updated

  # dmp/contact — a single person spec, no role
  # Standard RDMO catalog: project/data_management carries /name and /mbox
  # (documented as equivalent to rda:dmp/contact/name and rda:dmp/contact/mbox).
  # maDMP example catalog: project/dmp/contact
  contact:
    base_attribute: project/data_management

  # dmp/contributor — person specs, optionally per element of a set
  contributor:
    # In the installed catalog the preservation person is answered at dataset
    # level (name AND email); the standard-catalog alternative would be
    # `project/preservation/responsible_person` (email path missing there).
    - base_attribute: project/dataset/preservation/responsible_person
      mbox_suffix: email
      role_template: Responsible for preservation
    - base_attribute: project/dataset/metadata/responsible_person
      mbox_suffix: email
      set: project/dataset/id
      role_template: "Responsible for metadata for {set.text}"
    # maDMP example catalog only (not in the standard catalog):
    # - base_attribute: project/partner/contact_person
    #   set: project/partner/id
    #   role_template: "Contact person for {set.text}"
    # - base_attribute: project/dataset/data_security/backup_responsible
    #   set: project/dataset/id
    #   role_template: "Responsible for backup for {set.text}"
    # - base_attribute: project/dataset/pids/responsible_person
    #   set: project/dataset/id
    #   role_template: "Responsible for PIDs for {set.text}"

  # dmp/cost — one entry per answered cost question
  cost:
    - title: Personal costs for data creation
      attribute: project/costs/creation/personnel
    - title: Non personal costs for data creation
      attribute: project/costs/creation/non_personnel
    - title: Personal costs for data usage
      attribute: project/costs/usage/personnel
    - title: Non personal costs for data usage
      attribute: project/costs/usage/non_personnel
    - title: Personal costs for data storage
      attribute: project/costs/storage/personnel
    - title: Non personal costs for data storage
      attribute: project/costs/storage/non_personnel
    - title: Personal costs for metadata curation
      attribute: project/costs/metadata/personnel
    - title: Non personal costs for metadata curation
      attribute: project/costs/metadata/non_personnel
    - title: Personal costs for PID curation
      attribute: project/costs/pid/personnel
    - title: Non personal costs for PID curation
      attribute: project/costs/pid/non_personnel
    - title: Personal costs for data anonymization
      attribute: project/costs/sensitive_data/anonymization/personnel
    - title: Non personal costs for data anonymization
      attribute: project/costs/sensitive_data/anonymization/non_personnel
    - title: Personal costs for data security
      attribute: project/costs/sensitive_data/security/personnel
    - title: Non personal costs for data security
      attribute: project/costs/sensitive_data/security/non_personnel
    - title: Personal costs for intellectual property rights
      attribute: project/costs/ipr/personnel
    - title: Non personal costs for intellectual property rights
      attribute: project/costs/ipr/non_personnel
    - title: Personal costs for preservation
      attribute: project/costs/preservation/personnel
    - title: Non personal costs for preservation
      attribute: project/costs/preservation/non_personnel

  # dmp/dmp_id — the standard catalog has no question for it (gap register
  # item #6). A stable URN:UUID is minted deterministically per project
  # (uuid5 over the seed), so every export of the same project carries the
  # same DMP identifier.
  dmp_id:
    identifier:
      generated: urn_uuid5
      seed: "rdmo:project:{project.pk}"
    type:
      fixed: urn

  # dmp/language
  language:
    attribute: project/language
    options: language_options

  # dmp/project
  project:
    start:
      attribute: project/schedule/project_start
      extract: timestamp
    end:
      attribute: project/schedule/project_end
      extract: timestamp
    title:
      project_field: title
    description:
      project_field: description

# ---------------------------------------------------------------------------
# dataset (one maDMP dataset per element of the dataset set)
# ---------------------------------------------------------------------------
dataset:

  set: project/dataset/id

  fields:

    data_quality_assurance:
      attribute: project/dataset/quality_assurance   # maDMP example catalog only
      extract: list

    description:
      attribute: project/dataset/description

    # dmp/dataset/dataset_id — falls back to the dataset set value with type
    # 'other' when no persistent identifier was answered
    dataset_id:
      identifier:
        attribute: project/dataset/dataset_identifier   # maDMP example catalog only
      type:
        attribute: project/dataset/dataset_identifier
        options: dataset_id_type_options
        default: other
      fallback_identifier:
        attribute: project/dataset/id

    # Two distributions are rendered per dataset, as in the RDA maDMP common
    # standard: storage during the project and preservation afterwards. The
    # post-project data_access is derived in code: open iff the during-project
    # data_access is open, else closed.
    distribution:
      during:
        title: Storage during the project
        access_url:
          attribute: project/dataset/storage/uri
        data_access:
          attribute: project/dataset/sharing/yesno
          options: data_access_options
        format:
          attribute: project/dataset/format
          extract: list
      after:
        title: Preservation after the project
        certified_with:
          attribute: project/dataset/preservation/certification
          options: certified_with_options
        pid_system:
          attribute: project/dataset/pids/system          # maDMP example catalog only
          options: pid_system_options
        host:
          attribute: project/dataset/preservation/repository
          extract: value
        license_ref:
          attribute: project/dataset/sharing/conditions
          options: license_ref_options
        license_start_date:
          attribute: project/dataset/data_publication_date
          extract: timestamp

    issued:
      attribute: project/dataset/data_publication_date
      extract: timestamp

    keyword:
      attribute: project/research_question/keywords
      extract: list

    language:
      attribute: project/dataset/language   # maDMP example catalog only
      options: language_options

    personal_data:
      attribute: project/dataset/sensitive_data/personal_data_yesno/yesno
      extract: bool

    preservation_statement:
      attribute: project/dataset/preservation/purpose
      # checkbox question: one Value per ticked option, option text in `.value`
      # (`.text` stays empty) — joined into the single maDMP string
      extract: value_list
      join: "; "

    # dmp/dataset/security_and_privacy — one entry per answered question
    security_and_privacy:
      - title: Access authentication
        attribute: project/dataset/preservation/access_authentication
      # maDMP example catalog only:
      # - title: Access permissions
      #   attribute: project/dataset/data_security/access_permissions
      # - title: Security measures
      #   attribute: project/dataset/data_security/security_measures

    sensitive_data:
      attribute: project/dataset/sensitive_data/personal_data/bdsg_3_9
      extract: bool

    type:
      attribute: project/dataset/type   # maDMP example catalog only

    # dmp/dataset/title — falls back to "Dataset #n"
    title_fallback:
      attribute: project/dataset/id
