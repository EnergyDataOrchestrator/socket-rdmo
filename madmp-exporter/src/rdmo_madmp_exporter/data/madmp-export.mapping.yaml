# EDO maDMP export plugin for RDMO — mapping specification (card CF1-004)
#
# This file carries ALL mapping intelligence of the export plugin
# `exports.py::MaDMPExport` (the in-RDMO variant of the EDO maDMP production,
# next to the offline pipeline `answers_to_dmp.py` + `02_P02_S02_madmp-mapping.transform.yaml`).
# Following the EDO principle "intelligence in YAML, generic driver", the
# plugin realises the maDMP export functions against this spec; changing the
# RDMO catalog (attribute paths, option URIs) only requires editing this file.
#
# Attribute paths below are verified against the RDMO standard catalog
# (rdmorganiser terms, rdmo-catalog 2024) installed in the EDO RDMO instance
# (http://127.0.0.1:8000/, project #4). Paths that only exist in the maDMP
# example catalog are kept as commented alternatives.
#
# Leaf-spec grammar consumed by `exports.py`
# ------------------------------------------
#   {attribute: <rdmo path>, extract: text|list|bool|timestamp|value}
#       extract defaults to `text`; `value` returns the raw Value.value
#       (used for the repository host title), `timestamp` an ISO-8601 date.
#   {attribute: <rdmo path>, options: <options key below>, default: <value>}
#       translates an answered RDMO option (value.option.uri_path) into a
#       maDMP controlled-vocabulary term.
#   {project_field: <Project model attribute>}
#       reads a field of the RDMO project object itself.
#
# Person specs additionally accept `base_attribute` plus optional suffix
# overrides `name_suffix` / `mbox_suffix` / `identifier_suffix` (defaults:
# name / mbox / identifier), because catalogs differ (e.g. the standard RDMO
# catalog uses `.../email` instead of `.../mbox`).

id: https://w3id.org/edo/madmp-export-mapping
name: madmp-export-mapping

# ---------------------------------------------------------------------------
# Option maps: RDMO option uri_path -> maDMP controlled vocabulary
# (uri_paths verified in the EDO RDMO instance; extend as the catalog grows)
# ---------------------------------------------------------------------------
options:

  language_options: {}
    # '': 'eng'
    # '': 'deu'

  data_access_options:
    dataset_sharing_options/69: open
    dataset_sharing_options/68: shared
    dataset_sharing_options/67: shared
    dataset_sharing_options/70: closed

  certified_with_options: {}
    # '': 'din31644'
    # '': 'dini-zertifikat'
    # '': 'dsa'
    # '': 'iso16363'
    # '': 'iso16919'
    # '': 'trac'
    # '': 'wds'
    # '': 'coretrustseal'

  pid_system_options:
    pid_types/124: ark
    pid_types/123: doi
    pid_types/122: purl
    pid_types/154: other
    pid_types/121: other

  license_ref_options:
    dataset_license_types/71: https://creativecommons.org/licenses/by/4.0/
    dataset_license_types/73: https://creativecommons.org/licenses/by-nc/4.0/
    dataset_license_types/74: https://creativecommons.org/licenses/by-nd/4.0/
    dataset_license_types/75: https://creativecommons.org/licenses/by-sa/4.0/
    dataset_license_types/cc0: https://creativecommons.org/publicdomain/zero/1.0/deed.de

  person_id_type_options: {}
    # '': 'orcid'
    # '': 'isni'
    # '': 'openid'
    # '': 'other'

  dataset_id_type_options: {}
    # '': 'handle'
    # '': 'doi'
    # '': 'ark'
    # '': 'url'
    # '': 'other'

  dmp_id_type_options: {}
    # '': 'handle'
    # '': 'doi'
    # '': 'ark'
    # '': 'url'
    # '': 'other'

  funder_id_type_options: {}
    # '': 'fundref'
    # '': 'url'
    # '': 'other'

  grant_id_type_options: {}
    # '': 'url'
    # '': 'other'

  metadata_standard_id_options: {}
    # '': 'url'
    # '': 'other'

  currency_codes:
    [AED, AFN, ALL, AMD, ANG, AOA, ARS, AUD, AWG, AZN,
     BAM, BBD, BDT, BGN, BHD, BIF, BMD, BND, BOB, BRL,
     BSD, BTN, BWP, BYN, BZD, CAD, CDF, CHF, CLP, CNY,
     COP, CRC, CUC, CUP, CVE, CZK, DJF, DKK, DOP, DZD,
     EGP, ERN, ETB, EUR, FJD, FKP, GBP, GEL, GGP, GHS,
     GIP, GMD, GNF, GTQ, GYD, HKD, HNL, HRK, HTG, HUF,
     IDR, ILS, IMP, INR, IQD, IRR, ISK, JEP, JMD, JOD,
     JPY, KES, KGS, KHR, KMF, KPW, KRW, KWD, KYD, KZT,
     LAK, LBP, LKR, LRD, LSL, LYD, MAD, MDL, MGA, MKD,
     MMK, MNT, MOP, MRU, MUR, MVR, MWK, MXN, MYR, MZN,
     NAD, NGN, NIO, NOK, NPR, NZD, OMR, PAB, PEN, PGK,
     PHP, PKR, PLN, PYG, QAR, RON, RSD, RUB, RWF, SAR,
     SBD, SCR, SDG, SEK, SGD, SHP, SLL, SOS, SPL, SRD,
     STN, SVC, SYP, SZL, THB, TJS, TMT, TND, TOP, TRY,
     TTD, TVD, TWD, TZS, UAH, UGX, USD, UYU, UZS, VEF,
     VND, VUV, WST, XAF, XCD, XDR, XOF, XPF, YER, ZAR,
